<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Family Resort Finder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🏝️ Family Resort Finder</h1>
    <p>Discover the best family resorts around the world</p>
</header>


<div class="container">

    <div id="resort-grid" class="resort-grid">
        Loading resorts...
    </div>
<div id="resort-modal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <img id="modal-image">

        <h2 id="modal-title"></h2>

        <p id="modal-location"></p>

        <p id="modal-score"></p>

        <p id="modal-price"></p>

        <p id="modal-description"></p>

        <p id="modal-best"></p>

    </div>

</div>
</div>


<script src="app.js"></script>

</body>

</html>
