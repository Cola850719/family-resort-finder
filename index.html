<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Family Resort Finder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <header class="hero">

    <div class="hero-content">

        <h1>🏝️ Family Resort Finder</h1>

        <h2>
        Find your perfect family escape
        </h2>

        <p>
        Compare the best family resorts across Southeast Asia
        </p>


        <div class="hero-stats">

            <div>
                <strong>10+</strong>
                <span>Resorts</span>
            </div>

            <div>
                <strong>6</strong>
                <span>Countries</span>
            </div>

            <div>
                <strong>⭐ Family Rated</strong>
                <span>Holiday Choices</span>
            </div>

        </div>


        <div class="hero-buttons">

    <button class="hero-button">
        Explore Resorts
    </button>

    <button class="hero-button find-button" id="find-resort">
        🎯 Find My Resort
    </button>

</div>

    </div>

</header>


<div class="container">
    
<div class="filters">

    <select id="country-filter">
        <option value="all">All Countries</option>
    </select>

    <select id="score-filter">
        <option value="0">Any Family Score</option>
        <option value="90">90+ Family Score</option>
        <option value="80">80+ Family Score</option>
        <option value="70">70+ Family Score</option>
    </select>

    <select id="sort-filter">
        <option value="default">Sort By</option>
        <option value="price-low">Lowest Price</option>
        <option value="score-high">Highest Family Score</option>
    </select>

</div>
    <div id="resort-grid" class="resort-grid">
        Loading resorts...
    </div>
<div id="resort-modal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <img id="modal-image">

        <h2 id="modal-title"></h2>

        <p id="modal-location"></p>

        <p id="modal-score"></p>

        <p id="modal-price"></p>

        <p id="modal-description"></p>

        <p id="modal-best"></p>

    </div>

</div>
</div>


<script src="app.js"></script>

</body>

</html>
