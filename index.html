<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Family Resort Finder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <header class="hero">

    <div class="hero-content">

        <h1>🏝️ Family Resort Finder</h1>

        <h2>
        Find your perfect family escape
        </h2>

        <p>
        Compare the best family resorts across Southeast Asia
        </p>


        <div class="hero-stats">

            <div>
                <strong>10+</strong>
                <span>Resorts</span>
            </div>

            <div>
                <strong>6</strong>
                <span>Countries</span>
            </div>

            <div>
                <strong>⭐ Family Rated</strong>
                <span>Holiday Choices</span>
            </div>

        </div>


        <div class="hero-buttons">
        <button class="hero-button" id="show-favourites">
        ❤️ My Favourites
        </button>

    <button class="hero-button">
        Explore Resorts
    </button>

    <button class="hero-button find-button" id="find-resort">
        🎯 Find My Resort
    </button>

</div>

    </div>

</header>


<div class="container">
    
<div class="filters">

    <select id="country-filter">
        <option value="all">All Countries</option>
    </select>

    <select id="score-filter">
        <option value="0">Any Family Score</option>
        <option value="90">90+ Family Score</option>
        <option value="80">80+ Family Score</option>
        <option value="70">70+ Family Score</option>
    </select>

    <select id="sort-filter">
        <option value="default">Sort By</option>
        <option value="price-low">Lowest Price</option>
        <option value="score-high">Highest Family Score</option>
    </select>

</div>
    <div id="resort-grid" class="resort-grid">
        Loading resorts...
    </div>
<div id="resort-modal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <img id="modal-image">

        <h2 id="modal-title"></h2>

        <p id="modal-location"></p>

        <p id="modal-score"></p>

        <p id="modal-price"></p>

        <p id="modal-description"></p>

        <p id="modal-best"></p>

    </div>

</div>
</div>

<div id="finder-modal" class="modal">

    <div class="modal-content">

        <span class="finder-close close">&times;</span>

        <h2>🎯 Find My Resort</h2>

        <p>Tell us what matters most.</p>


        <label>Travel Month</label>

        <select id="travel-month">

            <option value="October">October</option>
            <option value="July">July</option>
            <option value="Easter">Easter</option>
            <option value="Anytime">Anytime</option>

        </select>


        <label>Budget</label>

        <select id="budget">

            <option value="200">Under $200/night</option>
            <option value="300">$200-$300/night</option>
            <option value="500">$300+/night</option>

        </select>


        <label>Priority</label>

        <select id="priority">

            <option value="kids">Kids Club</option>
            <option value="beach">Beach</option>
            <option value="pool">Pool</option>
            <option value="allinclusive">All Inclusive</option>

        </select>


        <button id="recommend-button">
            Show My Matches
        </button>


        <div id="recommendations"></div>


    </div>

</div>

<div id="favourites-modal" class="modal">

    <div class="modal-content">

        <span class="favourites-close close">&times;</span>

        <h2>❤️ My Favourite Resorts</h2>

        <div id="favourites-list">

            <p>No favourites saved yet.</p>

        </div>

    </div>

</div>
    
<script src="app.js"></script>

</body>

</html>
